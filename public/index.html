<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stibo AI Agent</title>
    <style>
        :root {
            --primary: #0056b3;
            --sidebar-bg: #202123;
            --sidebar-hover: #2a2b32;
            --chat-bg: #ffffff;
            --user-msg: #f3f4f6;
            --bot-msg: #ffffff;
            --text-main: #333;
            --text-light: #ececf1;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            background-color: var(--chat-bg);
            color: var(--text-main);
        }
        
        /* Layout */
        .app-layout {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .new-chat-btn {
            background: transparent;
            border: 1px solid #565869;
            color: white;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9em;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .new-chat-btn:hover {
            background: var(--sidebar-hover);
        }
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .history-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .history-item:hover, .history-item.active {
            background-color: var(--sidebar-hover);
        }
        
        /* Branding */
        .branding {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #4d4d4f;
            text-align: center;
        }
        .branding-title {
            font-weight: bold;
            font-size: 0.95em;
            color: white;
            margin-bottom: 4px;
        }
        .branding-sub {
            font-size: 0.8em;
            color: #b5b5b5;
        }
        .branding-author {
            font-size: 0.75em;
            color: #888;
            margin-top: 8px;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-header {
            padding: 15px 30px;
            font-weight: bold;
            font-size: 1.1em;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
        }
        .chat-box {
            flex: 1;
            padding: 40px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        .message-row {
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }
        .message-row.bot {
            background-color: #f7f7f8;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
        }
        .message-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 20px;
            padding: 0 20px;
            line-height: 1.6;
            font-size: 1em;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        .avatar-user { background-color: #10a37f; }
        .avatar-bot { background-color: var(--primary); }
        
        /* Input Area */
        .input-area-wrapper {
            padding: 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 30%);
        }
        .input-area {
            width: 100%;
            max-width: 800px;
            display: flex;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border-radius: 12px;
            background: white;
        }
        input {
            flex: 1;
            padding: 16px 50px 16px 20px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            outline: none;
            font-size: 1.05em;
        }
        input:focus {
            border-color: #b5b5b5;
        }
        button.send-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.send-btn:hover { background: #004494; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal h2 { margin-top: 0; color: var(--primary); }
        .modal input {
            width: 100%;
            box-sizing: border-box;
            margin: 20px 0;
            padding: 12px;
        }
        .modal button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
        }
        .hidden { display: none !important; }

        /* Thinking Indicator */
        .thinking-row {
            padding: 20px 0;
            display: flex;
            justify-content: center;
            background-color: #f7f7f8;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
        }
        .thinking-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 20px;
            padding: 0 20px;
            align-items: center;
        }
        .thinking-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .thinking-step {
            font-size: 0.9em;
            color: #999;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.4s;
        }
        .thinking-step.active {
            color: var(--primary);
            font-weight: 600;
        }
        .thinking-step.done {
            color: #10a37f;
        }
        .dots {
            display: inline-flex;
            gap: 4px;
        }
        .dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<!-- Onboarding Modal -->
<div id="nameModalOverlay" class="modal-overlay hidden">
    <div class="modal">
        <h2>Welcome to Stibo AI</h2>
        <p>Please enter your display name to continue.</p>
        <input type="text" id="nameInput" placeholder="Your Name" onkeypress="handleNameKey(event)">
        <button onclick="saveName()">Get Started</button>
    </div>
</div>

<div class="app-layout">
    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewSession()">
            <span>+</span> New Chat
        </button>
        <div class="history-list" id="historyList">
            <!-- Chat history renders here -->
        </div>
        
        <!-- Branding -->
        <div class="branding">
            <div class="branding-title">Stibo AI Agent</div>
            <div class="branding-sub">by Infosys</div>
            <div class="branding-author">Created by Bharat Garg</div>
        </div>
    </div>

    <!-- Main Chat -->
    <div class="main-chat">
        <div class="chat-header">
            <div>Stibo Support</div>
            <div id="greetingName" style="color: #666; font-size: 0.9em;"></div>
        </div>
        
        <div class="chat-box" id="chatBox">
            <!-- Messages render here -->
        </div>
        
        <div class="input-area-wrapper">
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Send a message to Stibo AI..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // State
    let displayName = "";
    let sessions = [];
    let currentSessionId = null;

    // Initialization
    window.onload = () => {
        displayName = localStorage.getItem('displayName');
        if (!displayName) {
            document.getElementById('nameModalOverlay').classList.remove('hidden');
        } else {
            initializeChat();
        }
    };

    function saveName() {
        const input = document.getElementById('nameInput').value.trim();
        if (input) {
            displayName = input;
            localStorage.setItem('displayName', displayName);
            document.getElementById('nameModalOverlay').classList.add('hidden');
            initializeChat();
        }
    }

    function handleNameKey(event) {
        if (event.key === 'Enter') saveName();
    }

    function initializeChat() {
        document.getElementById('greetingName').innerText = `Welcome, ${displayName}`;
        
        // Load sessions
        const saved = localStorage.getItem('chatSessions');
        if (saved) {
            sessions = JSON.parse(saved);
        }
        
        if (sessions.length === 0) {
            createNewSession();
        } else {
            loadSession(sessions[0].id);
        }
        renderSidebar();
    }

    function createNewSession() {
        const newSession = {
            id: Date.now().toString(),
            title: "New Chat",
            messages: [{ role: 'bot', text: `Hello ${displayName}! I'm your Stibo AI Agent. How can I assist you today?` }]
        };
        // Keep max 5 sessions
        sessions.unshift(newSession);
        if (sessions.length > 5) sessions.pop();
        
        saveSessions();
        loadSession(newSession.id);
        renderSidebar();
    }

    function loadSession(id) {
        currentSessionId = id;
        const session = sessions.find(s => s.id === id);
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        
        session.messages.forEach(msg => {
            renderMessage(msg.text, msg.role, false); // false = don't save, just render
        });
        
        renderSidebar(); // update active state
    }

    function saveSessions() {
        localStorage.setItem('chatSessions', JSON.stringify(sessions));
    }

    function renderSidebar() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        
        sessions.forEach(session => {
            const div = document.createElement('div');
            div.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            div.innerText = session.title;
            div.onclick = () => loadSession(session.id);
            list.appendChild(div);
        });
    }

    function renderMessage(text, role, save = true, msgId = null) {
        const chatBox = document.getElementById('chatBox');
        const row = document.createElement('div');
        row.className = `message-row ${role}`;
        if (msgId) row.id = msgId;
        
        const content = document.createElement('div');
        content.className = 'message-content';
        
        const avatar = document.createElement('div');
        avatar.className = `avatar avatar-${role}`;
        avatar.innerText = role === 'user' ? displayName.charAt(0).toUpperCase() : 'AI';
        
        const textDiv = document.createElement('div');
        textDiv.style.flex = "1";
        // Simple markdown parsing for bold text
        textDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        
        content.appendChild(avatar);
        content.appendChild(textDiv);
        row.appendChild(content);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (save) {
            const session = sessions.find(s => s.id === currentSessionId);
            session.messages.push({ role, text });
            
            // Auto-generate title from first user message
            if (role === 'user' && session.title === "New Chat") {
                session.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                renderSidebar();
            }
            saveSessions();
        }
    }

    function showThinkingIndicator() {
        const chatBox = document.getElementById('chatBox');
        const id = 'thinking-' + Date.now();

        const row = document.createElement('div');
        row.className = 'thinking-row';
        row.id = id;
        row.innerHTML = `
            <div class="thinking-content">
                <div class="avatar avatar-bot">AI</div>
                <div class="thinking-steps">
                    <div class="thinking-step active" id="${id}-status">
                        <span id="${id}-text">⏳ Starting...</span>
                        <div class="dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
            </div>`;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function updateThinkingStep(id, text) {
        const textEl = document.getElementById(`${id}-text`);
        if (textEl) textEl.innerText = text;
        const chatBox = document.getElementById('chatBox');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.querySelector('.send-btn');
        const message = input.value.trim();
        if (!message) return;

        renderMessage(message, 'user');
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        const thinkingId = showThinkingIndicator();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            // Parse SSE stream
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // Split on double newlines (SSE event boundaries)
                const parts = buffer.split('\n\n');
                buffer = parts.pop(); // keep incomplete last chunk

                for (const part of parts) {
                    const eventMatch = part.match(/^event: (\w+)/m);
                    const dataMatch  = part.match(/^data: (.+)/m);
                    if (!eventMatch || !dataMatch) continue;

                    const event = eventMatch[1];
                    const data  = JSON.parse(dataMatch[1]);

                    if (event === 'step') {
                        updateThinkingStep(thinkingId, data.text);
                    } else if (event === 'done') {
                        document.getElementById(thinkingId)?.remove();
                        renderMessage(data.reply, 'bot');
                    } else if (event === 'error') {
                        document.getElementById(thinkingId)?.remove();
                        renderMessage(data.reply, 'bot');
                    }
                }
            }
        } catch (error) {
            document.getElementById(thinkingId)?.remove();
            renderMessage("Error communicating with the Stibo server.", 'bot');
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
